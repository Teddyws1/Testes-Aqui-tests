<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Meta Viewport atualizada para bloquear o Zoom em Mobile/Tablet -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DívidaZero - Resumo de Meses</title>
    <!-- Ícones Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    
    <style>
          /* =========================================================
           DívidaZero - Estilos Painel Resumo (Grid & Fullscreen)
           ========================================================= */
        /* VARIÁVEIS DE TEMA E CONFIGURAÇÃO (:root e .theme-dark) */
        :root, :root.theme-light {
          --primary-color: #00a86b;
          --primary-dark: #007a4d;
          --header-bg: #0f172a;
          --accent-orange: #00a86b;
          --color-titulo: #ea580c;
          --accent-orange-hover: #ea580c;
          --bg-main: #f1f5f9;
          --bg-card: #ffffff;
          --text-main: #0f172a;
          --text-muted: #64748b;
          --border-color: #e2e8f0;
          --shadow-color: rgba(15, 23, 42, 0.08);
          --danger-color: #ef4444;
          --share-color: #2563eb;
          --success-color: #10b981;
          --sidebar-width: 290px;
          --fubdo-do-theme: #F5F5F5;
          
          --text-white: #ffffff;
          --header-btn-bg: rgba(255, 255, 255, 0.08);
          --header-btn-border: rgba(255, 255, 255, 0.12);
          --header-btn-active: rgba(255, 255, 255, 0.25);
          --dropdown-shadow: rgba(0, 0, 0, 0.2);
          --search-icon-color: #64748b;
          --empty-icon-opacity: 0.3;
          --tag-bg: rgba(0, 168, 107, 0.12);
          --tag-border: rgba(0, 168, 107, 0.25);
          --pending-bg: #fef3c7;
          --pending-color: #d97706;
          --pending-border: #fde68a;
          --paid-bg: #dcfce7;
          --paid-color: #15803d;
          --paid-border: #bbf7d0;
          --footer-stats-bg: rgba(255, 255, 255, 0.05);
          --footer-stats-border: rgba(255, 255, 255, 0.1);
          --stat-label-color: #94a3b8;
          --stat-paid-color: #4ade80;
          --stat-pending-color: #fbbf24;
          --stat-total-color: #38bdf8;
          --footer-row-color: #cbd5e1;
          --footer-dash-border: rgba(255, 255, 255, 0.15);
          --sidebar-item-border: #334155;
          --sidebar-item-hover-bg: #17233a;
          --sidebar-item-active-bg: #1e293b;
          --sidebar-item-focus-shadow: rgba(59, 130, 246, 0.20);
          --modal-overlay-bg: rgba(15, 23, 42, 0.65);
          --modal-shadow: rgba(0, 0, 0, 0.3);
          --btn-primary-shadow: rgba(249, 115, 22, 0.3);
          --github-bg: #24292f;
          --github-border: #3d444d;
          --github-hover-bg: #30363d;
          --toast-shadow: rgba(0, 0, 0, 0.25);
          --custom-overlay-bg: rgba(0, 0, 0, 0.6);
          --custom-modal-title: #e63946;
          --btn-secondary-bg: #e0e0e0;
          
          --header-title-grad: #a7f3d0;
          --month-navigator-shadow: rgba(0, 0, 0, 0.1);
          --social-insta-bg: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
          --social-insta-shadow: rgba(225, 48, 108, 0.3);
          --share-icon-shadow: rgba(0, 168, 107, 0.25);
          --whatsapp-bg: #25d366;
          --facebook-bg: #1877f2;
          --toast-success-icon: #4ade80;
          --success-bg: rgba(16, 185, 129, 0.15);
          --top-record-grad-1: rgba(234, 88, 12, 0.22);
          --top-record-grad-2: rgba(234, 88, 12, 0.05);
        }

        html.theme-dark {
          --accent-orange: #ea580c;
          --color-titulo: #FFFFFF;
          --primary-color: #059669;
          --fubdo-do-theme: #0f172a;
          --primary-dark: #047857;
          --header-bg: #020617;
          --bg-main: #090d16;
          --bg-card: #1e293b;
          --text-main: #f8fafc;
          --text-muted: #94a3b8;
          --border-color: #334155;
          --shadow-color: rgba(0, 0, 0, 0.6);
          
          --text-white: #f8fafc;
          --header-btn-bg: rgba(255, 255, 255, 0.05);
          --header-btn-border: rgba(255, 255, 255, 0.1);
          --header-btn-active: rgba(255, 255, 255, 0.2);
          --dropdown-shadow: rgba(0, 0, 0, 0.5);
          --search-icon-color: #94a3b8;
          --empty-icon-opacity: 0.2;
          --tag-bg: rgba(5, 150, 105, 0.15);
          --tag-color: #4ade80;
          --tag-border: rgba(5, 150, 105, 0.3);
          --pending-bg: rgba(217, 119, 6, 0.15);
          --pending-color: #fbbf24;
          --pending-border: rgba(217, 119, 6, 0.3);
          --paid-bg: rgba(21, 128, 61, 0.15);
          --paid-color: #4ade80;
          --paid-border: rgba(21, 128, 61, 0.3);
          --footer-stats-bg: rgba(0, 0, 0, 0.2);
          --footer-stats-border: rgba(255, 255, 255, 0.08);
          --stat-label-color: #94a3b8;
          --sidebar-item-border: #334155;
          --sidebar-item-hover-bg: #1e293b;
          --sidebar-item-active-bg: #0f172a;
          --custom-overlay-bg: rgba(0, 0, 0, 0.8);
          --btn-secondary-bg: #334155;
          
          --header-title-grad: #a7f3d0;
          --month-navigator-shadow: rgba(0, 0, 0, 0.1);
          --social-insta-bg: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
          --social-insta-shadow: rgba(225, 48, 108, 0.3);
          --share-icon-shadow: rgba(5, 150, 105, 0.25);
          --whatsapp-bg: #00FF5F;
          --facebook-bg: #1877f2;
          --toast-success-icon: #4ade80;
          --success-bg: rgba(74, 222, 128, 0.15);
          --top-record-grad-1: rgba(234, 88, 12, 0.22);
          --top-record-grad-2: rgba(234, 88, 12, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            
            /* Sistema Anti-Seleção */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        button, a, input, div {
            outline: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: calc(16px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)) 20px;
            -webkit-touch-callout: none;
            touch-action: pan-x pan-y;
        }

        /* Header Principal */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .header-left-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--color-titulo);
        }

        .icon-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background: var(--accent-orange-hover);
            border-color: var(--accent-orange-hover);
            color: var(--text-white);
        }

        /* Conteúdo Principal */
        #panel-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        /* Card do Recorde (Fixo no Topo) */
        .top-record-card {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--bg-card);
            background-image: linear-gradient(135deg, var(--top-record-grad-1), var(--top-record-grad-2));
            border: 1px solid var(--accent-orange);
            border-radius: 14px;
            padding: 16px 20px;
            box-shadow: 0 8px 24px var(--shadow-color);
            backdrop-filter: blur(10px);
        }

        .top-record-header {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-orange);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-record-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .top-record-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .top-record-value {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--accent-orange);
        }

        /* Gráfico em Pizza / Donut Container Interativo */
        .pie-chart-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
        }

        .pie-chart-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 12px;
            padding: 6px 0;
        }

        .donut-chart {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: conic-gradient(var(--conic-data));
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px var(--shadow-color);
            flex-shrink: 0;
        }

        .donut-center {
            position: absolute;
            width: 82px;
            height: 82px;
            background-color: var(--bg-card);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4px;
            box-shadow: inset 0 2px 6px var(--shadow-color);
            pointer-events: none;
        }

        .donut-center-title {
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .donut-center-value {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--accent-orange);
            margin-top: 2px;
        }

        .donut-legend {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 170px;
            max-width: 100%;
            overflow: hidden;
        }

        .legend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-muted);
            padding: 4px 8px;
            background: var(--footer-stats-bg);
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .legend-item:hover, .legend-item.active {
            background: var(--tag-bg);
            border-color: var(--accent-orange);
            color: var(--text-main);
            transform: translateX(4px);
        }

        .legend-left {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .legend-color-box {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        /* Container em Grade (3 colunas) */
        .months-list-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .month-select-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            min-height: 145px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .month-select-card:hover {
            border-color: var(--accent-orange);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px var(--shadow-color);
        }

        .month-select-card.is-record {
            border-top: 4px solid var(--accent-orange);
        }

        .month-card-name {
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            width: 100%;
            color: var(--text-main);
        }

        .record-tag {
            font-size: 0.65rem;
            background: var(--accent-orange);
            color: var(--text-white);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
        }

        .card-company-name {
            font-size: 0.78rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            margin-top: 6px;
        }

        .status-badge.paid {
            background-color: var(--paid-bg);
            color: var(--paid-color);
            border: 1px solid var(--paid-border);
        }

        .status-badge.pending {
            background-color: var(--pending-bg);
            color: var(--pending-color);
            border: 1px solid var(--pending-border);
        }

        .top-month-banner {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
        }

        .top-month-total {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent-orange);
            margin: 6px 0;
        }

        .top-month-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .top-stat-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
        }

        .top-stat-val.paid { color: var(--paid-color); font-weight: 700; font-size: 1.2rem; }
        .top-stat-val.pending { color: var(--pending-color); font-weight: 700; font-size: 1.2rem; }

        .debt-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: var(--bg-card);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-top: 8px;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .status-indicator {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .status-indicator.is-paid {
            background: var(--paid-bg);
            color: var(--paid-color);
            border-color: var(--paid-border);
        }

        @media (max-width: 650px) {
            .months-list-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 400px) {
            .months-list-container {
                grid-template-columns: 1fr;
            }
        }
/* Transição suave padrão para o corpo da página */
body {
    transition: transform 0.4s ease, opacity 0.4s ease;
    will-change: transform, opacity;
}

/* Animação de saída deslizando para a esquerda (ao fazer o gesto) */
body.slide-out-left {
    transform: translateX(-100%);
    opacity: 0;
}

    </style>
</head>
<body>

    <header class="page-header">
        <div class="header-left-group">
            <!-- Botão de Voltar para a Página Inicial (Ícone de Casa) -->
            <button type="button" class="icon-btn" id="btn-home" title="Página Inicial">
                <ion-icon name="home-outline"></ion-icon>
            </button>
            <!-- Botão de Voltar Dinâmico para os Meses -->
            <button type="button" class="icon-btn" id="btn-back-to-months" style="display: none;" title="Voltar">
                <ion-icon name="arrow-back-outline"></ion-icon>
            </button>
            <h1 id="page-title">
                <ion-icon name="calendar-outline" style="color:var(--accent-orange);"></ion-icon>
                Meses Registrados
            </h1>
        </div>
        <div style="display: flex; gap: 8px;">
            <!-- Botão de Alternar Tema -->
            <button type="button" class="icon-btn" id="theme-toggle-btn" title="Alternar Tema">
                <ion-icon name="moon-outline" id="theme-icon"></ion-icon>
            </button>
        </div>
    </header>

    <main id="panel-content"></main>
    
    <script src="painel-resumo.js" defer></script>
</body>
</html>
