<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DívidaZero - Resumo de Meses</title>
    <!-- Ícones Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    
    <style>
        /* =========================================================
           1. VARIÁVEIS DE TEMA E SISTEMA DE CORES
           ========================================================= */
        :root, :root.theme-light {
            --primary-color: #00a86b;
            --header-bg: #0f172a;
            --accent-orange: #ea580c;
            --accent-orange-hover: #c2410c;
            --color-titulo: #ea580c;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-color: rgba(15, 23, 42, 0.06);
            --shadow-hover: rgba(15, 23, 42, 0.12);
            --danger-color: #ef4444;
            --success-color: #10b981;
            --text-white: #ffffff;
            --pending-bg: #fef3c7;
            --pending-color: #d97706;
            --pending-border: #fde68a;
            --paid-bg: #dcfce7;
            --paid-color: #15803d;
            --paid-border: #bbf7d0;
            --top-record-grad-1: rgba(234, 88, 12, 0.12);
            --top-record-grad-2: rgba(234, 88, 12, 0.02);
            --container-max-width: 960px;
        }

        html.theme-dark {
            --accent-orange: #ea580c;
            --accent-orange-hover: #f97316;
            --color-titulo: #f8fafc;
            --primary-color: #059669;
            --header-bg: #020617;
            --bg-main: #090d16;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --shadow-hover: rgba(0, 0, 0, 0.6);
            --text-white: #f8fafc;
            --pending-bg: rgba(217, 119, 6, 0.15);
            --pending-color: #fbbf24;
            --pending-border: rgba(217, 119, 6, 0.3);
            --paid-bg: rgba(21, 128, 61, 0.15);
            --paid-color: #4ade80;
            --paid-border: rgba(21, 128, 61, 0.3);
            --top-record-grad-1: rgba(234, 88, 12, 0.22);
            --top-record-grad-2: rgba(234, 88, 12, 0.05);
        }

        /* RESET E CONFIGURAÇÕES GLOBAIS */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        button, input, select {
            outline: none;
            font: inherit;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)) 16px;
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.4s ease, opacity 0.4s ease;
            will-change: transform, opacity;
        }

        body.slide-out-left {
            transform: translateX(-100%);
            opacity: 0;
        }

        /* =========================================================
           2. CABEÇALHO (PAGE HEADER)
           ========================================================= */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: var(--container-max-width);
            width: 100%;
            margin: 0 auto 20px auto;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-left-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--color-titulo);
            line-height: 1.2;
        }

        .icon-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px var(--shadow-color);
        }

        .icon-btn:hover {
            background: var(--accent-orange);
            border-color: var(--accent-orange);
            color: var(--text-white);
            transform: translateY(-1px);
        }

        /* =========================================================
           3. CONTAINER PRINCIPAL E ESTRUTURA DOS COMPONENTES
           ========================================================= */
        #panel-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: var(--container-max-width);
            width: 100%;
            margin: 0 auto;
        }

        /* DESTAQUE DE RECORDES E KPIS DA ABA DE RESUMO */
        .top-record-card {
            background: var(--bg-card);
            background-image: linear-gradient(135deg, var(--top-record-grad-1), var(--top-record-grad-2));
            border: 1px solid var(--accent-orange);
            border-radius: 14px;
            padding: 16px 20px;
            box-shadow: 0 4px 16px var(--shadow-color);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .top-record-header {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-orange);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-record-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-record-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .top-record-value {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--accent-orange);
        }

        /* GRÁFICOS E PAINEL DE DONUT */
        .pie-chart-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        .pie-chart-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 16px;
        }

        .donut-chart {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: conic-gradient(var(--conic-data, #334155 0deg 360deg));
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px var(--shadow-color);
            flex-shrink: 0;
        }

        .donut-center {
            position: absolute;
            width: 90px;
            height: 90px;
            background-color: var(--bg-card);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4px;
            pointer-events: none;
        }

        .donut-center-title {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .donut-center-value {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--accent-orange);
            margin-top: 2px;
        }

        .donut-legend {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 200px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding: 6px 10px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .legend-item:hover, .legend-item.active {
            border-color: var(--accent-orange);
            color: var(--text-main);
            transform: translateX(4px);
        }

        .legend-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color-box {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        /* =========================================================
           4. LISTA DE MESES (LAYOUT EM GRID)
           ========================================================= */
        .months-list-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .month-select-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            min-height: 130px;
            cursor: pointer;
            box-shadow: 0 2px 8px var(--shadow-color);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .month-select-card:hover {
            border-color: var(--accent-orange);
            transform: translateY(-3px);
            box-shadow: 0 8px 18px var(--shadow-hover);
        }

        .month-select-card.is-record {
            border-top: 4px solid var(--accent-orange);
        }

        .month-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .month-card-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-main);
        }

        .card-company-name {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .record-tag {
            font-size: 0.65rem;
            background: var(--accent-orange);
            color: var(--text-white);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
        }

        .month-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 12px;
        }

        .month-card-value {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-orange);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .status-badge.paid {
            background-color: var(--paid-bg);
            color: var(--paid-color);
            border: 1px solid var(--paid-border);
        }

        .status-badge.pending {
            background-color: var(--pending-bg);
            color: var(--pending-color);
            border: 1px solid var(--pending-border);
        }

        /* DETALHES DO MÊS SELECIONADO */
        .top-month-banner {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        .top-month-total {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent-orange);
            margin: 4px 0;
        }

        .top-month-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .top-stat-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 2px 6px var(--shadow-color);
        }

        .top-stat-val.paid { color: var(--paid-color); font-weight: 700; font-size: 1.15rem; }
        .top-stat-val.pending { color: var(--pending-color); font-weight: 700; font-size: 1.15rem; }

        .debt-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-top: 8px;
            box-shadow: 0 2px 6px var(--shadow-color);
        }

        .status-indicator {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--pending-bg);
            color: var(--pending-color);
            border: 1px solid var(--pending-border);
        }

        .status-indicator.is-paid {
            background: var(--paid-bg);
            color: var(--paid-color);
            border-color: var(--paid-border);
        }

        /* =========================================================
           5. ADAPTATIVIDADE / RESPONSIVIDADE (MEDIA QUERIES)
           ========================================================= */
        @media (max-width: 820px) {
            .months-list-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 520px) {
            .months-list-container {
                grid-template-columns: 1fr;
            }

            .top-month-stats {
                grid-template-columns: 1fr;
            }

            .page-header h1 {
                font-size: 1.1rem;
            }

            .icon-btn {
                width: 38px;
                height: 38px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <header class="page-header">
        <div class="header-left-group">
            <button type="button" class="icon-btn" id="btn-home" title="Página Inicial">
                <ion-icon name="home-outline"></ion-icon>
            </button>
            <button type="button" class="icon-btn" id="btn-back-to-months" style="display: none;" title="Voltar">
                <ion-icon name="arrow-back-outline"></ion-icon>
            </button>
            <h1 id="page-title">
                <ion-icon name="calendar-outline" style="color:var(--accent-orange);"></ion-icon>
                Meses Registrados
            </h1>
        </div>
        <div style="display: flex; gap: 8px;">
            <button type="button" class="icon-btn" id="theme-toggle-btn" title="Alternar Tema">
                <ion-icon name="moon-outline" id="theme-icon"></ion-icon>
            </button>
        </div>
    </header>

    <main id="panel-content"></main>

    <script src="painel-resumo.js" defer></script>
</body>
</html>
